services:
  postgres:
    image: postgres:16-alpine
    container_name: telegame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telegame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: telegame
    volumes:
      - telegame-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegame"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/richmelese/game-center-backend:${IMAGE_TAG:-latest}
    container_name: telegame-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    image: ghcr.io/richmelese/game-center-frontend:${IMAGE_TAG:-latest}
    container_name: telegame-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  telegame-pgdata:
