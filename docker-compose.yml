services:
  postgres:
    image: postgres:16-alpine
    container_name: telegame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: telegame
      POSTGRES_PASSWORD: telegame
      POSTGRES_DB: telegame
    ports:
      - "127.0.0.1:5434:5432" # this computer only; never expose the database to the network
    volumes:
      - telegame-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telegame-pgdata:
